<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merge PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@900&family=Source+Serif+4:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f0efeb;
    --ink:#0d0d0c;
    --muted:#66645e;
    --soft:rgba(13,13,12,.22);
    --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
    --display:"Playfair Display", "Bodoni 72", Didot, Georgia, serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
  body{
    margin:0;
    background-color:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit}
  .wrap{max-width:1240px; margin:0 auto; padding:0 clamp(16px,5vw,64px)}
  .spacer{flex:1}

  /* ---- header ---- */
  .top{display:flex; justify-content:space-between; align-items:center; padding-top:32px}
  .eyebrow{margin:0; font-size:13px; letter-spacing:.2em; color:var(--muted)}
  h1{
    margin:0;
    font-family:var(--display); font-weight:900; text-transform:uppercase;
    font-size:clamp(40px,7vw,88px); line-height:.9; letter-spacing:-.01em;
  }
  .tag{
    margin:16px 0 32px; max-width:26em;
    font-family:var(--serif); font-style:italic; font-weight:600;
    font-size:clamp(18px,2vw,22px); line-height:1.35;
  }
  hr{border:0; border-top:1px solid var(--ink); margin:0}

  /* ---- buttons ---- */
  .btn{
    font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; border:1px solid var(--ink); border-radius:0;
    padding:11px 16px; cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .btn:hover:not(:disabled){background:var(--ink); color:var(--bg)}
  .btn.primary{background:var(--ink); color:var(--bg)}
  .btn.primary:hover:not(:disabled){background:transparent; color:var(--ink)}
  .btn:disabled{opacity:.35; cursor:not-allowed}
  .btn.sm{padding:8px 12px}
  button:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

  /* ---- bar ---- */
  .bar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    display:flex; align-items:center; flex-wrap:wrap; gap:10px;
    padding:12px 0;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--ink);
  }
  .count{font-size:13px; color:var(--muted); white-space:nowrap}

  /* ---- ribbon ---- */
  main{padding:32px 0 120px}
  .ribbon{width:100%; max-width:900px; margin:0 auto}
  .file{margin-bottom:14px}
  .file-bar{display:flex; align-items:center; gap:12px; padding:6px 0 10px; font-size:12px; color:var(--muted)}
  .file-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:min(60vw,480px); color:var(--ink)}
  .mini{
    width:28px; height:28px; padding:0; display:grid; place-items:center;
    border:1px solid var(--ink); border-radius:0; background:transparent;
    font-size:13px; line-height:1; cursor:pointer;
  }
  .mini:hover:not(:disabled){background:var(--ink); color:var(--bg)}
  .mini:disabled{opacity:.3; cursor:not-allowed}
  .sheet-row{display:grid; grid-template-columns:44px 1fr; align-items:start; margin-bottom:12px}
  .num{font-size:12px; color:var(--muted); padding:6px 14px 0 0; text-align:right; border-right:1px solid var(--soft); align-self:stretch}
  .sheet{position:relative; overflow:hidden; width:100%; margin-left:14px; background:#fff; border:1px solid var(--soft)}
  .sheet canvas{display:block; width:100%; height:auto}
  .sheet.pending::after{content:""; position:absolute; inset:0; background:#fff}

  /* ---- drop zone ---- */
  .zone{
    display:grid; place-items:center; align-content:center; gap:10px;
    width:100%; min-height:min(40vh,320px); padding:48px 24px; margin:0;
    background:#fff; border:1px solid var(--ink); border-radius:0;
    text-align:center; cursor:pointer;
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .zone:hover{background:#fafaf8}
  .zone svg{margin-bottom:14px}
  .zt{font-family:var(--serif); font-weight:700; font-size:clamp(22px,3vw,30px); line-height:1.1}
  .zh{font-size:14px; color:var(--muted)}

  /* ---- drag overlay and status ---- */
  #drop{position:fixed; inset:0; z-index:40; display:none; place-items:center; background:color-mix(in srgb, var(--bg) 82%, transparent)}
  #drop.on{display:grid}
  #drop div{background:#fff; border:2px dashed var(--ink); padding:36px 52px; font-family:var(--serif); font-weight:700; font-size:24px; text-align:center}
  #status{
    position:fixed; left:50%; transform:translateX(-50%); z-index:30;
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    display:none; max-width:min(92vw,560px);
    background:var(--ink); color:var(--bg); padding:10px 16px; font-size:13px;
  }
  #status.on{display:block}

  @media (max-width:640px){
    .top{padding-top:28px}
    .sheet-row{grid-template-columns:30px 1fr}
    .num{padding-right:8px}
    .sheet{margin-left:8px}
    .bar .btn{padding:9px 12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 data-i="title"></h1>
    <button class="btn sm" id="lang" type="button" aria-label="Language"></button>
  </div>
  <p class="tag" data-i="tag"></p>
  <hr>

  <div class="bar">
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="btn" id="add" type="button" data-i="add"></button>
    <button class="btn" id="clear" type="button" data-i="clear" disabled></button>
    <button class="btn primary" id="save" type="button" data-i="save" disabled></button>
  </div>

  <main>
    <div class="ribbon" id="ribbon"></div>
    <section id="empty">
      <button class="zone" id="add2" type="button">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 30V8M13 16l9-9 9 9M7 28v8h30v-8"/></svg>
        <span class="zt" data-i="zt"></span>
        <span class="zh" data-i="zh"></span>
      </button>
    </section>
  </main>
</div>

<div id="drop"><div data-i="drop"></div></div>
<div id="status" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  "use strict";

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  var files = [];          // {id, name, buf, doc, pages}
  var seq = 0;
  var ribbon = document.getElementById("ribbon");
  var empty  = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var picker = document.getElementById("picker");
  var btnSave = document.getElementById("save");
  var btnClear = document.getElementById("clear");
  var countEl = document.getElementById("count");
  var hideTimer;

  var L = "en";
  try { L = localStorage.getItem("pdfmerge-lang") === "ru" ? "ru" : "en"; } catch(e){}
  var T = {
    ru: {
      doc:"Склейка PDF", eyebrow:"PDF · СКЛЕЙКА · В БРАУЗЕРЕ", title:"Склейка",
      tag:"Несколько PDF в одну ленту — в порядке добавления.",
      note:"Всё работает локально в вашем браузере.\nФайлы никуда не загружаются и нигде не хранятся.",
      add:"Добавить файлы", clear:"Очистить", save:"Сохранить одним PDF",
      zt:"Перетащите PDF сюда", zh:"или нажмите, чтобы выбрать файлы",
      drop:"Отпустите — добавлю в конец ленты",
      up:"Поднять выше", down:"Опустить ниже", del:"Убрать файл",
      notpdf:"Это не PDF. Подходят только файлы .pdf",
      merging:"Собираю…", done:"Готово", unknown:"неизвестная ошибка",
      nf:function(n){ return n + " " + plural(n,"файл","файла","файлов"); },
      np:function(n){ return n + " " + plural(n,"страница","страницы","страниц"); },
      reading:function(n){ return "Читаю " + T.ru.nf(n) + "…"; },
      bad:function(n){ return "Не получилось открыть «" + n + "» — файл повреждён или защищён паролем"; },
      fail:function(m){ return "Сохранить не вышло: " + m; }
    },
    en: {
      doc:"Merge PDF", eyebrow:"PDF · MERGE · IN YOUR BROWSER", title:"Merge",
      tag:"Several PDFs in one ribbon, in the order you add them.",
      note:"Everything runs locally in your browser.\nNothing is uploaded or stored anywhere.",
      add:"Add files", clear:"Clear", save:"Save as one PDF",
      zt:"Drop PDFs here", zh:"or click to choose files",
      drop:"Release to add to the end of the ribbon",
      up:"Move up", down:"Move down", del:"Remove file",
      notpdf:"That's not a PDF. Only .pdf files work.",
      merging:"Merging…", done:"Done", unknown:"unknown error",
      nf:function(n){ return n + (n === 1 ? " file" : " files"); },
      np:function(n){ return n + (n === 1 ? " page" : " pages"); },
      reading:function(n){ return "Reading " + T.en.nf(n) + "…"; },
      bad:function(n){ return "Couldn't open “" + n + "” — the file is damaged or password-protected"; },
      fail:function(m){ return "Couldn't save: " + m; }
    }
  };
  function t(k, a){ var s = T[L][k]; return typeof s === "function" ? s(a) : s; }
  function setLang(l, save){
    L = l;
    if (save) { try { localStorage.setItem("pdfmerge-lang", l); } catch(e){} }
    document.documentElement.lang = l;
    document.title = t("doc");
    document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.dataset.i); });
    document.getElementById("lang").textContent = l === "ru" ? "EN" : "RU";
    render();
  }

  function say(text, sticky){
    clearTimeout(hideTimer);
    if (!text){ statusEl.classList.remove("on"); return; }
    statusEl.textContent = text;
    statusEl.classList.add("on");
    if (!sticky) hideTimer = setTimeout(function(){ statusEl.classList.remove("on"); }, 3500);
  }

  /* ---------- lazy page rendering ---------- */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      draw(e.target);
    });
  }, { rootMargin: "1200px 0px" });

  function draw(holder){
    var f = files.find(function(x){ return x.id === holder.dataset.file; });
    if (!f) return;
    var n = Number(holder.dataset.page);
    f.doc.getPage(n).then(function(page){
      var base = page.getViewport({ scale: 1 });
      var cssW = holder.clientWidth || 800;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var vp = page.getViewport({ scale: (cssW / base.width) * dpr });
      var c = document.createElement("canvas");
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      var ctx = c.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){
        holder.classList.remove("pending");
        holder.innerHTML = "";
        holder.appendChild(c);
      });
    }).catch(function(){
      holder.classList.remove("pending");
    });
  }

  /* ---------- build the ribbon ---------- */
  function render(){
    ribbon.innerHTML = "";
    var total = 0;
    files.forEach(function(f){ total += f.pages; });

    empty.style.display = files.length ? "none" : "";
    btnSave.disabled = btnClear.disabled = !files.length;
    countEl.textContent = files.length
      ? t("nf", files.length) + " · " +
        t("np", total)
      : "";

    var num = 0;
    files.forEach(function(f, idx){
      var block = document.createElement("section");
      block.className = "file";

      var bar = document.createElement("div");
      bar.className = "file-bar";

      var name = document.createElement("span");
      name.className = "file-name";
      name.textContent = f.name;
      bar.appendChild(name);

      var meta = document.createElement("span");
      meta.textContent = t("np", f.pages);
      bar.appendChild(meta);

      var sp = document.createElement("span");
      sp.className = "spacer";
      bar.appendChild(sp);

      bar.appendChild(mini("↑", t("up"), idx === 0, function(){ move(idx, -1); }));
      bar.appendChild(mini("↓", t("down"), idx === files.length - 1, function(){ move(idx, 1); }));
      bar.appendChild(mini("✕", t("del"), false, function(){ remove(f.id); }));
      block.appendChild(bar);

      for (var p = 1; p <= f.pages; p++){
        num++;
        var row = document.createElement("div");
        row.className = "sheet-row";

        var lbl = document.createElement("div");
        lbl.className = "num";
        lbl.textContent = num;
        row.appendChild(lbl);

        var holder = document.createElement("div");
        holder.className = "sheet pending";
        holder.dataset.file = f.id;
        holder.dataset.page = p;
        holder.style.aspectRatio = f.sizes[p-1];
        row.appendChild(holder);

        block.appendChild(row);
        io.observe(holder);
      }
      ribbon.appendChild(block);
    });
  }

  function mini(label, title, disabled, fn){
    var b = document.createElement("button");
    b.className = "mini";
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-label", title);
    b.disabled = disabled;
    b.addEventListener("click", fn);
    return b;
  }

  function plural(n, one, few, many){
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function move(idx, dir){
    var t = idx + dir;
    if (t < 0 || t >= files.length) return;
    var tmp = files[idx]; files[idx] = files[t]; files[t] = tmp;
    render();
  }

  function remove(id){
    files = files.filter(function(f){ return f.id !== id; });
    render();
  }

  /* ---------- accepting files ---------- */
  function accept(list){
    var arr = Array.prototype.slice.call(list).filter(function(f){
      return /\.pdf$/i.test(f.name) || f.type === "application/pdf";
    });
    if (!arr.length){ say(t("notpdf")); return; }
    say(t("reading", arr.length), true);

    var chain = Promise.resolve();
    arr.forEach(function(file){
      chain = chain.then(function(){ return one(file); });
    });
    chain.then(function(){ say(""); render(); });
  }

  function one(file){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({ data: buf.slice(0) }).promise.then(function(doc){
        var sizes = [];
        var steps = Promise.resolve();
        for (var i = 1; i <= doc.numPages; i++){
          (function(i){
            steps = steps.then(function(){
              return doc.getPage(i).then(function(p){
                var v = p.getViewport({ scale: 1 });
                sizes.push(v.width + " / " + v.height);
              });
            });
          })(i);
        }
        return steps.then(function(){
          files.push({
            id: "f" + (++seq),
            name: file.name,
            buf: buf,
            doc: doc,
            pages: doc.numPages,
            sizes: sizes
          });
        });
      });
    }).catch(function(){
      say(t("bad", file.name));
    });
  }

  /* ---------- saving ---------- */
  function merge(){
    var out;
    btnSave.disabled = true;
    say(t("merging"), true);
    return PDFLib.PDFDocument.create().then(function(d){
      out = d;
      var chain = Promise.resolve();
      files.forEach(function(f){
        chain = chain.then(function(){
          return PDFLib.PDFDocument.load(f.buf.slice(0), { ignoreEncryption: true })
            .then(function(src){ return out.copyPages(src, src.getPageIndices()); })
            .then(function(pages){ pages.forEach(function(p){ out.addPage(p); }); });
        });
      });
      return chain;
    }).then(function(){
      return out.save();
    }).then(function(bytes){
      return new Blob([bytes], { type: "application/pdf" });
    });
  }

  function save(){
    merge().then(function(blob){
      var filename = "sklejka-" + new Date().toISOString().slice(0,10) + ".pdf";
      var use = window.claude && window.claude.use;
      var dl = use ? window.claude.use("downloads") : Promise.resolve(null);
      return dl.then(function(d){
        if (d) return d.save({ filename: filename, data: blob });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        return { status: "saved" };
      });
    }).then(function(){
      say(t("done"));
    }).catch(function(err){
      if (err && err.code === "declined") say("");
      else say(t("fail", (err && err.message) || t("unknown")));
    }).then(function(){
      btnSave.disabled = !files.length;
    });
  }

  /* ---------- events ---------- */
  var dropEl = document.getElementById("drop");
  var depth = 0;
  window.addEventListener("dragenter", function(e){
    e.preventDefault(); depth++; dropEl.classList.add("on");
  });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("dragleave", function(){
    depth--; if (depth <= 0){ depth = 0; dropEl.classList.remove("on"); }
  });
  window.addEventListener("drop", function(e){
    e.preventDefault(); depth = 0; dropEl.classList.remove("on");
    if (e.dataTransfer && e.dataTransfer.files) accept(e.dataTransfer.files);
  });

  document.getElementById("add").addEventListener("click", function(){ picker.click(); });
  document.getElementById("add2").addEventListener("click", function(){ picker.click(); });
  picker.addEventListener("change", function(){ accept(picker.files); picker.value = ""; });
  btnClear.addEventListener("click", function(){ files = []; render(); });
  btnSave.addEventListener("click", save);

  window.addEventListener("resize", function(){
    clearTimeout(window.__rz);
    window.__rz = setTimeout(function(){
      document.querySelectorAll(".sheet").forEach(function(h){
        h.classList.add("pending"); h.innerHTML = ""; io.observe(h);
      });
    }, 300);
  });

  document.getElementById("lang").addEventListener("click", function(){ setLang(L === "ru" ? "en" : "ru", true); });
  setLang(L);
})();
</script>
</body>
</html>
