<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Склейка PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    --canvas:#D7DCE2;
    --canvas-deep:#C8CFD7;
    --sheet:#FFFFFF;
    --ink:#15181D;
    --muted:#646E7A;
    --line:#B7C0CA;
    --accent:#0E6B58;
    --accent-soft:rgba(14,107,88,.12);
    --shadow:0 1px 2px rgba(20,28,38,.18), 0 10px 24px rgba(20,28,38,.14);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#1B1E23;
      --canvas-deep:#141619;
      --sheet:#F2F3F5;
      --ink:#E9EBEE;
      --muted:#8A94A0;
      --line:#343A42;
      --accent:#5FD8B4;
      --accent-soft:rgba(95,216,180,.14);
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.42);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#1B1E23;
    --canvas-deep:#141619;
    --sheet:#F2F3F5;
    --ink:#E9EBEE;
    --muted:#8A94A0;
    --line:#343A42;
    --accent:#5FD8B4;
    --accent-soft:rgba(95,216,180,.14);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.42);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top: calc(env(safe-area-inset-top,0px) + 64px)}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- шапка ---- */
  header{
    position:sticky;
    top: env(safe-area-inset-top, 0px);
    z-index:20;
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px;
    background:color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  h1{
    margin:0;
    font-size:17px;
    font-weight:600;
    letter-spacing:-.01em;
    white-space:nowrap;
  }
  .count{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;
    color:var(--muted);
    white-space:nowrap;
  }
  .spacer{flex:1}
  button{
    font:inherit;
    font-size:14px;
    font-weight:500;
    border-radius:7px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease, opacity .12s ease;
  }
  button:hover:not(:disabled){background:var(--accent-soft); border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button:disabled{opacity:.4; cursor:not-allowed}
  .primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--canvas-deep);
    font-weight:600;
  }
  .primary:hover:not(:disabled){background:var(--accent); filter:brightness(1.07)}

  /* ---- лента ---- */
  main{padding:28px 20px 120px; display:flex; flex-direction:column; align-items:center}
  .ribbon{width:100%; max-width:880px}

  .file{margin-bottom:10px}
  .file-bar{
    display:flex; align-items:center; gap:10px;
    padding:6px 2px 8px;
    font-size:13px; color:var(--muted);
  }
  .file-name{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    max-width:min(60vw, 480px);
  }
  .file-bar .mini{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    width:26px; height:26px; padding:0; border-radius:6px;
    font-size:13px; line-height:1; display:grid; place-items:center;
  }
  .file-bar .mini:hover:not(:disabled){color:var(--ink)}

  .sheet-row{
    display:grid;
    grid-template-columns:44px 1fr;
    align-items:start;
    margin-bottom:10px;
  }
  .num{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;
    color:var(--muted);
    padding-top:6px;
    text-align:right;
    padding-right:14px;
    border-right:1px solid var(--line);
    align-self:stretch;
  }
  .sheet{
    background:var(--sheet);
    box-shadow:var(--shadow);
    border-radius:2px;
    margin-left:14px;
    width:100%;
    overflow:hidden;
    position:relative;
  }
  .sheet canvas{display:block; width:100%; height:auto}
  .sheet.pending::after{
    content:"";
    position:absolute; inset:0;
    background:var(--sheet);
  }

  /* ---- пустой экран ---- */
  .empty{
    width:100%; max-width:880px;
    margin-top:6vh;
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:64px 28px;
    text-align:center;
  }
  .empty p{margin:0 0 6px; font-size:19px; font-weight:500}
  .empty small{color:var(--muted); font-size:14px; display:block; margin-bottom:22px}

  /* ---- оверлей перетаскивания ---- */
  #drop{
    position:fixed; inset:0; z-index:40;
    display:none; place-items:center;
    background:color-mix(in srgb, var(--canvas) 78%, transparent);
  }
  #drop.on{display:grid}
  #drop div{
    border:2px dashed var(--accent);
    border-radius:12px;
    padding:36px 52px;
    font-size:18px; font-weight:500;
    background:var(--canvas);
  }

  #status{
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    z-index:30;
    background:var(--canvas-deep);
    border:1px solid var(--line);
    color:var(--ink);
    padding:9px 16px; border-radius:8px;
    font-size:14px;
    box-shadow:var(--shadow);
    display:none;
    max-width:min(92vw,560px);
  }
  #status.on{display:block}

  @media (max-width:640px){
    header{padding:10px 12px; gap:10px}
    h1{font-size:15px}
    main{padding:18px 10px 100px}
    .sheet-row{grid-template-columns:30px 1fr}
    .num{padding-right:8px}
    .sheet{margin-left:8px}
    .count{display:none}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<header>
  <h1>Склейка PDF</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button id="add">Добавить файлы</button>
  <button id="clear" disabled>Очистить</button>
  <button id="save" class="primary" disabled>Сохранить одним PDF</button>
</header>

<main>
  <div class="ribbon" id="ribbon"></div>
  <section class="empty" id="empty">
    <p>Перетащите сюда PDF-файлы</p>
    <small>Страницы встанут одной лентой сверху вниз — в том порядке, в котором вы их добавите</small>
    <button id="add2">Выбрать файлы</button>
  </section>
</main>

<div id="drop"><div>Отпустите — добавлю в конец ленты</div></div>
<div id="status" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(function(){
  "use strict";

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  var files = [];          // {id, name, buf, doc, pages}
  var seq = 0;
  var ribbon = document.getElementById("ribbon");
  var empty  = document.getElementById("empty");
  var statusEl = document.getElementById("status");
  var picker = document.getElementById("picker");
  var btnSave = document.getElementById("save");
  var btnClear = document.getElementById("clear");
  var countEl = document.getElementById("count");
  var hideTimer;

  function say(text, sticky){
    clearTimeout(hideTimer);
    if (!text){ statusEl.classList.remove("on"); return; }
    statusEl.textContent = text;
    statusEl.classList.add("on");
    if (!sticky) hideTimer = setTimeout(function(){ statusEl.classList.remove("on"); }, 3500);
  }

  /* ---------- ленивая отрисовка страниц ---------- */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      draw(e.target);
    });
  }, { rootMargin: "1200px 0px" });

  function draw(holder){
    var f = files.find(function(x){ return x.id === holder.dataset.file; });
    if (!f) return;
    var n = Number(holder.dataset.page);
    f.doc.getPage(n).then(function(page){
      var base = page.getViewport({ scale: 1 });
      var cssW = holder.clientWidth || 800;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      var vp = page.getViewport({ scale: (cssW / base.width) * dpr });
      var c = document.createElement("canvas");
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      var ctx = c.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){
        holder.classList.remove("pending");
        holder.innerHTML = "";
        holder.appendChild(c);
      });
    }).catch(function(){
      holder.classList.remove("pending");
    });
  }

  /* ---------- сборка ленты ---------- */
  function render(){
    ribbon.innerHTML = "";
    var total = 0;
    files.forEach(function(f){ total += f.pages; });

    empty.style.display = files.length ? "none" : "";
    btnSave.disabled = btnClear.disabled = !files.length;
    countEl.textContent = files.length
      ? files.length + " " + plural(files.length, "файл","файла","файлов") + " · " +
        total + " " + plural(total, "страница","страницы","страниц")
      : "";

    var num = 0;
    files.forEach(function(f, idx){
      var block = document.createElement("section");
      block.className = "file";

      var bar = document.createElement("div");
      bar.className = "file-bar";

      var name = document.createElement("span");
      name.className = "file-name";
      name.textContent = f.name;
      bar.appendChild(name);

      var meta = document.createElement("span");
      meta.textContent = f.pages + " " + plural(f.pages, "страница","страницы","страниц");
      bar.appendChild(meta);

      var sp = document.createElement("span");
      sp.className = "spacer";
      bar.appendChild(sp);

      bar.appendChild(mini("↑", "Поднять выше", idx === 0, function(){ move(idx, -1); }));
      bar.appendChild(mini("↓", "Опустить ниже", idx === files.length - 1, function(){ move(idx, 1); }));
      bar.appendChild(mini("✕", "Убрать файл", false, function(){ remove(f.id); }));
      block.appendChild(bar);

      for (var p = 1; p <= f.pages; p++){
        num++;
        var row = document.createElement("div");
        row.className = "sheet-row";

        var lbl = document.createElement("div");
        lbl.className = "num";
        lbl.textContent = num;
        row.appendChild(lbl);

        var holder = document.createElement("div");
        holder.className = "sheet pending";
        holder.dataset.file = f.id;
        holder.dataset.page = p;
        holder.style.aspectRatio = f.sizes[p-1];
        row.appendChild(holder);

        block.appendChild(row);
        io.observe(holder);
      }
      ribbon.appendChild(block);
    });
  }

  function mini(label, title, disabled, fn){
    var b = document.createElement("button");
    b.className = "mini";
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-label", title);
    b.disabled = disabled;
    b.addEventListener("click", fn);
    return b;
  }

  function plural(n, one, few, many){
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function move(idx, dir){
    var t = idx + dir;
    if (t < 0 || t >= files.length) return;
    var tmp = files[idx]; files[idx] = files[t]; files[t] = tmp;
    render();
  }

  function remove(id){
    files = files.filter(function(f){ return f.id !== id; });
    render();
  }

  /* ---------- приём файлов ---------- */
  function accept(list){
    var arr = Array.prototype.slice.call(list).filter(function(f){
      return /\.pdf$/i.test(f.name) || f.type === "application/pdf";
    });
    if (!arr.length){ say("Это не PDF. Подходят только файлы .pdf"); return; }
    say("Читаю " + arr.length + " " + plural(arr.length,"файл","файла","файлов") + "…", true);

    var chain = Promise.resolve();
    arr.forEach(function(file){
      chain = chain.then(function(){ return one(file); });
    });
    chain.then(function(){ say(""); render(); });
  }

  function one(file){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({ data: buf.slice(0) }).promise.then(function(doc){
        var sizes = [];
        var steps = Promise.resolve();
        for (var i = 1; i <= doc.numPages; i++){
          (function(i){
            steps = steps.then(function(){
              return doc.getPage(i).then(function(p){
                var v = p.getViewport({ scale: 1 });
                sizes.push(v.width + " / " + v.height);
              });
            });
          })(i);
        }
        return steps.then(function(){
          files.push({
            id: "f" + (++seq),
            name: file.name,
            buf: buf,
            doc: doc,
            pages: doc.numPages,
            sizes: sizes
          });
        });
      });
    }).catch(function(){
      say("Не получилось открыть «" + file.name + "» — файл повреждён или защищён паролем");
    });
  }

  /* ---------- сохранение ---------- */
  function merge(){
    var out;
    btnSave.disabled = true;
    say("Собираю…", true);
    return PDFLib.PDFDocument.create().then(function(d){
      out = d;
      var chain = Promise.resolve();
      files.forEach(function(f){
        chain = chain.then(function(){
          return PDFLib.PDFDocument.load(f.buf.slice(0), { ignoreEncryption: true })
            .then(function(src){ return out.copyPages(src, src.getPageIndices()); })
            .then(function(pages){ pages.forEach(function(p){ out.addPage(p); }); });
        });
      });
      return chain;
    }).then(function(){
      return out.save();
    }).then(function(bytes){
      return new Blob([bytes], { type: "application/pdf" });
    });
  }

  function save(){
    merge().then(function(blob){
      var filename = "sklejka-" + new Date().toISOString().slice(0,10) + ".pdf";
      var use = window.claude && window.claude.use;
      var dl = use ? window.claude.use("downloads") : Promise.resolve(null);
      return dl.then(function(d){
        if (d) return d.save({ filename: filename, data: blob });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        return { status: "saved" };
      });
    }).then(function(){
      say("Готово");
    }).catch(function(err){
      if (err && err.code === "declined") say("");
      else say("Сохранить не вышло: " + ((err && err.message) || "неизвестная ошибка"));
    }).then(function(){
      btnSave.disabled = !files.length;
    });
  }

  /* ---------- события ---------- */
  var dropEl = document.getElementById("drop");
  var depth = 0;
  window.addEventListener("dragenter", function(e){
    e.preventDefault(); depth++; dropEl.classList.add("on");
  });
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("dragleave", function(){
    depth--; if (depth <= 0){ depth = 0; dropEl.classList.remove("on"); }
  });
  window.addEventListener("drop", function(e){
    e.preventDefault(); depth = 0; dropEl.classList.remove("on");
    if (e.dataTransfer && e.dataTransfer.files) accept(e.dataTransfer.files);
  });

  document.getElementById("add").addEventListener("click", function(){ picker.click(); });
  document.getElementById("add2").addEventListener("click", function(){ picker.click(); });
  picker.addEventListener("change", function(){ accept(picker.files); picker.value = ""; });
  btnClear.addEventListener("click", function(){ files = []; render(); });
  btnSave.addEventListener("click", save);

  window.addEventListener("resize", function(){
    clearTimeout(window.__rz);
    window.__rz = setTimeout(function(){
      document.querySelectorAll(".sheet").forEach(function(h){
        h.classList.add("pending"); h.innerHTML = ""; io.observe(h);
      });
    }, 300);
  });

  render();
})();
</script>
</body>
</html>
