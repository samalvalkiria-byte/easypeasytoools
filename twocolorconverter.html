<script>
(function(){
  const translations = {
    ru: {
      pageTitle: 'Конвертер Ч/Б изображений | Онлайн бинаризация фото',
      eyebrow: 'чёрное · белое · порог',
      headline: 'Конвертер Ч/Б',
      script: 'конвертер',
      caption: 'свет и тень, разделённые ровно там, где скажете вы.',
      choose: 'Выбрать изображение',
      dragHint: 'или перетащите файл (на компьютере)',
      threshold: 'Порог',
      invert: 'Инвертировать',
      reset: 'Сбросить',
      download: 'Скачать PNG',
      dark: 'Тёмный',
      light: 'Светлый',
      colorsLabel: 'Цвета',
      privacy: 'Обработка происходит локально в браузере — файлы никуда не отправляются.',
      adLabel: 'По вопросам рекламы:',
      statusLoading: 'Загрузка…',
      statusNotImage: 'Это не изображение. Выберите файл JPG, PNG или WebP.',
      statusLoadError: 'Не удалось открыть файл. Попробуйте другое изображение.',
      statusNeedImage: 'Сначала загрузите изображение.'
    },
    en: {
      pageTitle: 'Two Color Converter | Free Online Threshold Image Converter',
      eyebrow: 'black · white · threshold',
      headline: 'Two Color Converter',
      script: 'converter',
      caption: 'light and shadow, split exactly where you say.',
      choose: 'Choose an image',
      dragHint: 'or drag & drop a file (desktop)',
      threshold: 'Threshold',
      invert: 'Invert',
      reset: 'Reset',
      download: 'Download PNG',
      dark: 'Dark',
      light: 'Light',
      colorsLabel: 'Colors',
      privacy: 'Processing happens locally in your browser — files are never uploaded.',
      adLabel: 'For advertising inquiries:',
      statusLoading: 'Loading…',
      statusNotImage: "That's not an image. Choose a JPG, PNG or WebP file.",
      statusLoadError: "Couldn't open the file. Try another image.",
      statusNeedImage: 'Load an image first.'
    }
  };

  // English is the default language
  let currentLang = 'en';
  let statusKey = null;

  function applyLang(lang){
    currentLang = lang;
    const dict = translations[lang];
    document.documentElement.lang = lang;
    document.getElementById('pageTitle').textContent = dict.pageTitle;
    document.title = dict.pageTitle;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.textContent = dict[key];
    });
    document.getElementById('langRu').classList.toggle('active', lang === 'ru');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    renderStatus();
  }

  document.getElementById('langRu').addEventListener('click', () => applyLang('ru'));
  document.getElementById('langEn').addEventListener('click', () => applyLang('en'));

  const dropzone = document.getElementById('dropzone');
  const emptyState = document.getElementById('emptyState');
  const fileInput = document.getElementById('fileInput');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const thresholdSlider = document.getElementById('threshold');
  const thresholdValue = document.getElementById('thresholdValue');
  const invertBtn = document.getElementById('invertBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusHint = document.getElementById('statusHint');

  const colorList = document.getElementById('colorList');
  const colorCount = document.getElementById('colorCount');
  const MAX_COLORS = 10;
  const MIN_COLORS = 2;
  let colors = ['#000000', '#ffffff'];

  let originalGray = null;
  let width = 0, height = 0;
  let inverted = false;

  function renderStatus(){
    statusHint.textContent = statusKey ? (translations[currentLang][statusKey] || '') : '';
  }

  function setStatus(key){
    statusKey = key;
    renderStatus();
  }

  function normalizeHex(str){
    if(!str) return null;
    const digits = str.replace(/[^0-9a-fA-F]/g, '');
    if(digits.length !== 6) return null;
    return '#' + digits.toLowerCase();
  }

  function hexToRgb(hex){
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  function renderColorList(){
    colorList.innerHTML = '';
    colors.forEach((hex, idx) => {
      const item = document.createElement('div');
      item.className = 'color-item';

      const colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.value = hex;
      colorInput.addEventListener('input', () => {
        colors[idx] = colorInput.value;
        textInput.value = colorInput.value;
        render();
      });

      const textInput = document.createElement('input');
      textInput.type = 'text';
      textInput.value = hex;
      textInput.maxLength = 9;
      textInput.spellcheck = false;
      textInput.autocapitalize = 'off';
      textInput.autocomplete = 'off';
      textInput.setAttribute('inputmode', 'text');
      textInput.addEventListener('input', () => {
        const h = normalizeHex(textInput.value);
        if(h){
          colors[idx] = h;
          colorInput.value = h;
          render();
        }
      });
      textInput.addEventListener('blur', () => {
        const h = normalizeHex(textInput.value);
        textInput.value = h || colors[idx];
      });

      item.appendChild(colorInput);
      item.appendChild(textInput);

      if(colors.length > MIN_COLORS){
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'Remove color');
        removeBtn.addEventListener('click', () => {
          colors.splice(idx, 1);
          renderColorList();
          render();
        });
        item.appendChild(removeBtn);
      }

      colorList.appendChild(item);
    });

    if(colors.length < MAX_COLORS){
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-color-btn';
      addBtn.textContent = '+';
      addBtn.setAttribute('aria-label', 'Add color');
      addBtn.addEventListener('click', () => {
        if(colors.length >= MAX_COLORS) return;
        colors.push('#888888');
        renderColorList();
        render();
      });
      colorList.appendChild(addBtn);
    }

    colorCount.textContent = colors.length + ' / ' + MAX_COLORS;
  }

  function loadImage(file){
    if(!file){
      return;
    }
    if(!file.type || !file.type.startsWith('image/')){
      setStatus('statusNotImage');
      return;
    }
    setStatus('statusLoading');
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      width = img.naturalWidth;
      height = img.naturalHeight;

      const MAX_DIM = 2000;
      let w = width, h = height;
      if(w > MAX_DIM || h > MAX_DIM){
        const scale = MAX_DIM / Math.max(w,h);
        w = Math.round(w*scale);
        h = Math.round(h*scale);
      }
      width = w; height = h;

      canvas.width = width;
      canvas.height = height;

      const tmp = document.createElement('canvas');
      tmp.width = width; tmp.height = height;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0, width, height);
      const imgData = tctx.getImageData(0,0,width,height);
      const data = imgData.data;

      originalGray = new Uint8ClampedArray(width*height);
      for(let i=0, p=0; i<data.length; i+=4, p++){
        const r = data[i], g = data[i+1], b = data[i+2];
        originalGray[p] = 0.299*r + 0.587*g + 0.114*b;
      }

      dropzone.classList.add('has-image');
      emptyState.style.display = 'none';
      inverted = false;
      setStatus(null);
      render();
      URL.revokeObjectURL(url);
    };
    img.onerror = function(){
      setStatus('statusLoadError');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function render(){
    const t = parseInt(thresholdSlider.value, 10);
    thresholdValue.textContent = t;
    if(!originalGray) return;

    const sorted = colors
      .map(hexToRgb)
      .map(rgb => ({ rgb, lum: 0.299*rgb.r + 0.587*rgb.g + 0.114*rgb.b }))
      .sort((a, b) => a.lum - b.lum)
      .map(o => o.rgb);

    const n = sorted.length;
    const binSize = 256 / n;
    const offset = t - 128;

    const out = ctx.createImageData(width, height);
    const od = out.data;
    for(let p=0, i=0; p<originalGray.length; p++, i+=4){
      let adjusted = originalGray[p] - offset;
      if(adjusted < 0) adjusted = 0;
      else if(adjusted > 255) adjusted = 255;
      let bin = Math.floor(adjusted / binSize);
      if(bin >= n) bin = n - 1;
      if(bin < 0) bin = 0;
      if(inverted) bin = n - 1 - bin;
      const c = sorted[bin];
      od[i] = c.r; od[i+1] = c.g; od[i+2] = c.b; od[i+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  fileInput.addEventListener('change', (e) => {
    loadImage(e.target.files[0]);
  });

  ['dragenter','dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragging');
    });
  });
  ['dragleave','drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragging');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadImage(file);
  });

  thresholdSlider.addEventListener('input', render);

  invertBtn.addEventListener('click', () => {
    inverted = !inverted;
    render();
  });

  resetBtn.addEventListener('click', () => {
    thresholdSlider.value = 128;
    inverted = false;
    colors = ['#000000', '#ffffff'];
    renderColorList();
    render();
  });

  downloadBtn.addEventListener('click', () => {
    if(!originalGray){
      setStatus('statusNeedImage');
      return;
    }
    const link = document.createElement('a');
    link.download = 'chb-poroga.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type && item.type.startsWith('image/')){
        loadImage(item.getAsFile());
        break;
      }
    }
  });

  renderColorList();
  render();
})();
</script>

</body>
</html>
