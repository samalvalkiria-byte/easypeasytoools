<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f5f0;--panel:#efece4;--ink:#151310;--grey:#726f67;--line:rgba(21,19,16,.3)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:40px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:32px}
h1{font-family:'Archivo Black',sans-serif;font-size:clamp(32px,6vw,56px);line-height:1;margin:0 0 8px;text-transform:uppercase}
header p{margin:0;color:var(--grey);max-width:480px}
.lang{display:flex;border:1px solid var(--ink);flex-shrink:0}
.lang button{font:600 13px 'Archivo',sans-serif;padding:8px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
a.card{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,background .15s}
a.card:hover{background:var(--ink);color:var(--paper);transform:translateY(-3px)}
a.card:hover .d{color:rgba(247,245,240,.7)}
.n{font-size:12px;color:var(--grey);font-weight:600}
a.card:hover .n{color:rgba(247,245,240,.7)}
h2{font-family:'Archivo Black',sans-serif;font-size:20px;margin:0;line-height:1.15}
.d{color:var(--grey);font-size:14px;margin:0}
.go{margin-top:auto;padding-top:8px;font-weight:600;font-size:14px}
@media(prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 data-t="title">Image Tools</h1>
    <p data-t="sub">A small collection of browser tools for photos and PDFs. Everything runs locally.</p>
  </div>
  <div class="lang"><button data-l="en" class="on">EN</button><button data-l="ru">RU</button></div>
</header>
<div class="grid" id="grid"></div>
</div>
<script>
const tools=[
 {
  f:'twocolorconverter.html',
  en:['Two-Color Converter','Turn any image into pure black and white with an adjustable threshold.'],
  ru:['Ч/Б конвертер','Превращает изображение в чисто чёрно-белое с настраиваемым порогом.']
 },
 {
  f:'cross-stitch-converter.html',
  en:['Cross-Stitch Converter','Convert a photo into a cross-stitch pattern with a thread palette.'],
  ru:['Схема для вышивки крестиком','Преобразует фото в схему для вышивки крестиком с палитрой ниток.']
 },
 {
  f:'linocut.html',
  en:['Linocut Maker','Turn a photo into a bold linocut-style print.'],
  ru:['Линогравюра','Превращает фото в контрастный отпечаток в стиле линогравюры.']
 },
 {
  f:'stipple.html',
  en:['Stipple Halftone','Render a photo as a plate of dots in a halftone style.'],
  ru:['Пунктир и полутона','Превращает фото в изображение из точек в стиле полутона.']
 },
 {
  f:'pixelate.html',
  en:['Pixel Art Maker','Convert a photo into pixel art with a chosen resolution and palette.'],
  ru:['Пиксель-арт','Превращает фото в пиксель-арт с выбранным разрешением и палитрой.']
 },
 {
  f:'pdf-sklejka.html',
  en:['PDF Merger','Combine several PDF files into a single document.'],
  ru:['Склейка PDF','Объединяет несколько PDF-файлов в один документ.']
 }
];

const ui={
  en:{title:'Image Tools',sub:'A small collection of browser tools for photos and PDFs. Everything runs locally.',open:'Open →'},
  ru:{title:'Инструменты для изображений',sub:'Небольшой набор браузерных инструментов для фото и PDF. Всё работает локально.',open:'Открыть →'}
};

function render(l){
  document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=ui[l][e.dataset.t]);
  document.title=ui[l].title;
  document.getElementById('grid').innerHTML=tools.map((t,i)=>
    `<a class="card" href="${t.f}"><span class="n">${String(i+1).padStart(2,'0')}</span><h2>${t[l][0]}</h2><p class="d">${t[l][1]}</p><span class="go">${ui[l].open}</span></a>`
  ).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  try{localStorage.setItem('lang',l)}catch(e){}
}

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>render(b.dataset.l));

let s='en';
try{s=localStorage.getItem('lang')||((navigator.language||'').startsWith('ru')?'ru':'en')}catch(e){}
render(s);
</script>
</body>
</html>
